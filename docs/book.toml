[book]
authors = ["rsteube"]
language = "en"
src = "src"
title = "carapace-pixi"
description = "Carapace Picture Book"

[output.html]
default-theme = "Latte"
preferred-dark-theme = "Mocha"
additional-css = ["./theme/catppuccin.css"]
git-repository-url = "https://github.com/carapace-sh/carapace-pixi"
edit-url-template = "https://github.com/carapace-sh/carapace-pixi/edit/master/docs/{path}"

[output.html.fold]
enable = true

[output.linkcheck2]
follow-web-links = true
exclude = [
  'archlinux\.org',
  'carapace-sh.github.io/carapace-pixi',
  'gnu\.org',
  'stackoverflow\.com',
]

[preprocessor.asciinema]
[preprocessor.catppuccin]
